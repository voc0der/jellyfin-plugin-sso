name: PR Develop Build

# An installable archive of every pull request, for trying it on a server before it merges.
#
# It runs in the pull request's own context: a read-only token, no secrets, and caches that main
# never restores. It used to be started by hand with a pull request's number, which ran that
# pull request's code in main's context instead, where it could have poisoned the npm caches the
# test workflows restore on main.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-pr:
    runs-on: ubuntu-latest

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        dotnet-version: 11.0.x

    - name: Set build metadata
      shell: bash
      run: |
        BUILD_TAG="pr/${PR_NUMBER}"
        FOLDER_NAME="SSO_Authentication_pr-${PR_NUMBER}_develop"
        ZIP_NAME="${FOLDER_NAME}.zip"

        echo "BUILD_TAG=${BUILD_TAG}" >> "$GITHUB_ENV"
        echo "FOLDER_NAME=${FOLDER_NAME}" >> "$GITHUB_ENV"
        echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

    # build.sh runs the tests and checks the archive holds only what the plugin ships.
    # BUILD_TAG lands in the archive as BUILD_TAG.txt, so an installed build says which
    # pull request it came from.
    - name: Build and package PR
      shell: bash
      run: |
        ./build.sh
        mv artifacts/SSO_Authentication_*.zip "${ZIP_NAME}"

    - name: Upload zip artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: "${{ env.FOLDER_NAME }}"
        path: "${{ env.ZIP_NAME }}"
        if-no-files-found: error

    - name: Build summary
      shell: bash
      run: |
        {
          echo "### PR develop build complete"
          echo ""
          echo "- PR: #${PR_NUMBER}"
          echo "- Build tag: \`${BUILD_TAG}\`"
          echo "- Artifact: \`${ZIP_NAME}\`"
        } >> "$GITHUB_STEP_SUMMARY"
