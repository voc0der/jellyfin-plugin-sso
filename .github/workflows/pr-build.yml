name: PR Develop Build

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to build (example: 1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-pr:
    runs-on: ubuntu-latest

    # Bound to the job environment rather than interpolated into each run: block.
    # A ${{ }} expression is substituted into the script text before bash sees it, so a
    # crafted input would run as shell -- including inside the step meant to validate it.
    env:
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Validate PR input
      shell: bash
      run: |
        if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
          echo "Invalid pr_number input: ${PR_NUMBER}"
          exit 1
        fi

    - name: Checkout PR branch
      shell: bash
      run: |
        git fetch origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}"
        git checkout "pr-${PR_NUMBER}"

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        dotnet-version: 10.0.x

    - name: Set build metadata
      shell: bash
      run: |
        BUILD_TAG="pr/${PR_NUMBER}"
        FOLDER_NAME="SSO_Authentication_pr-${PR_NUMBER}_develop"
        ZIP_NAME="${FOLDER_NAME}.zip"

        echo "BUILD_TAG=${BUILD_TAG}" >> "$GITHUB_ENV"
        echo "FOLDER_NAME=${FOLDER_NAME}" >> "$GITHUB_ENV"
        echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

    # build.sh runs the tests and checks the archive holds only what the plugin ships.
    # BUILD_TAG lands in the archive as BUILD_TAG.txt, so an installed build says which
    # pull request it came from.
    - name: Build and package PR
      shell: bash
      run: |
        ./build.sh
        mv artifacts/SSO_Authentication_*.zip "${ZIP_NAME}"

    - name: Upload zip artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: "${{ env.FOLDER_NAME }}"
        path: "${{ env.ZIP_NAME }}"
        if-no-files-found: error

    - name: Build summary
      shell: bash
      run: |
        {
          echo "### PR develop build complete"
          echo ""
          echo "- PR: #${PR_NUMBER}"
          echo "- Build tag: \`${BUILD_TAG}\`"
          echo "- Artifact: \`${ZIP_NAME}\`"
        } >> "$GITHUB_STEP_SUMMARY"
