name: PR Develop Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the requested PR
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr_number must be a positive integer" >&2
            exit 1
          fi
          git fetch origin "pull/${PR_NUMBER}/head"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - name: Publish development build
        run: >-
          dotnet publish SSO-Auth/SSO-Auth.csproj --configuration Release --no-restore
          --output artifacts/publish -p:InformationalVersion="pr/${PR_NUMBER}"
      - name: Package development build
        run: >-
          python3 scripts/plugin.py package --version 0.0.0.0
          --build-tag "pr/${PR_NUMBER}"
          --output "artifacts/SSO_Authentication_pr-${PR_NUMBER}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SSO-Authentication-pr-${{ env.PR_NUMBER }}
          path: artifacts/*.zip*
          if-no-files-found: error
          retention-days: 14
