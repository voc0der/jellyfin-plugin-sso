name: Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        dotnet-version: 11.0.x

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 26

    - name: Restore dependencies
      run: dotnet restore

    - name: Check plugin GUID
      run: bash scripts/verify-plugin-guid.sh

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test the coverage gate
      run: python3 -B -m unittest discover -s tests/coverage

    - name: Run unit tests with coverage
      run: >-
        dotnet test --no-build --configuration Release --verbosity minimal
        --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

    - name: Require 100% C# line coverage
      run: python3 scripts/check-coverage.py artifacts/coverage

    - name: Keep the coverage report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: csharp-coverage
        path: artifacts/coverage/**/coverage.cobertura.xml
        if-no-files-found: warn

    # The settings and linking pages are plain ES modules served from the DLL, with no build
    # step, so a syntax error would otherwise only show up in a browser.
    - name: Check the page scripts parse
      run: |
        for script in Config/config.js Config/linking.js Views/apiClient.js; do
          node --input-type=module --check < "Jellyfin.Plugin.SsoAuthentication/$script"
        done

    - name: Check whitespace formatting
      run: dotnet format whitespace --verify-no-changes --verbosity minimal

    - name: Check C# style formatting
      run: dotnet format style --verify-no-changes --severity warn --verbosity minimal
