name: Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Restore dependencies
      run: dotnet restore

    - name: Check plugin GUID
      run: bash scripts/verify-plugin-guid.sh

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity minimal

    # The settings and linking pages are plain ES modules served from the DLL, with no build
    # step, so a syntax error would otherwise only show up in a browser.
    - name: Check the page scripts parse
      run: |
        for script in Config/config.js Config/linking.js Views/apiClient.js; do
          node --input-type=module --check < "Jellyfin.Plugin.SsoAuthentication/$script"
        done

    - name: Check whitespace formatting
      run: dotnet format whitespace --verify-no-changes --verbosity minimal

    - name: Check C# style formatting
      run: dotnet format style --verify-no-changes --severity warn --verbosity minimal
